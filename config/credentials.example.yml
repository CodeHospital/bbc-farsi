# Template for the app's encrypted Rails credentials. This file is documentation
# only — it is never loaded. Copy the keys you need into the real credentials:
#
#   bin/rails credentials:edit            # opens config/credentials.yml.enc
#
# (decrypted with config/master.key locally, or RAILS_MASTER_KEY in production).
# Run `bin/rails bbc:credentials` to see which keys are set / missing.
# ENV is no longer read for any of these.

# Rails' own key for signing/encrypting cookies (generated automatically).
# secret_key_base: ...

# ── Required ─────────────────────────────────────────────────────────────────
# Bootstrap admin — the app refuses to boot (outside test) without all three.
# Only used once, by `bin/rails db:seed`, when the users table is empty.
admin_username: choose_a_username
admin_password: choose_a_strong_password
admin_email: admin@example.com

# Shared bearer token the Ollama worker client sends to /api/tasks. The worker
# (worker/worker.rb, a separate program) still reads WORKER_API_TOKEN from its
# own environment — set the SAME value there.
worker_api_token: generate_a_long_random_secret

# ── Production database ──────────────────────────────────────────────────────
# PostgreSQL connection string (production only; development/test use SQLite).
database_url: postgres://user:password@host:5432/khabarestan_production

# ── Public URL of this app ───────────────────────────────────────────────────
# Used for llmarkt webhook callbacks, Telegram admin-bot webhook, mail links
# and production host authorization.
app_base_url: https://news.example.com

# ── llmarkt LLM grid (primary LLM backend, optional) ─────────────────────────
llmarkt_api_url: https://llmarkt.codehospital.com/api/v1
llmarkt_api_key: your_llmarkt_bearer_token
llmarkt_model_match: family # "family" (default) or "exact"

# ── Outgoing mail via Resend (optional) ──────────────────────────────────────
resend_api_key: re_your_resend_api_key
sender_email: "Khabarestan <noreply@yourdomain.com>"

# ── Error tracking (optional) ────────────────────────────────────────────────
sentry_dsn: https://examplePublicKey@o0.ingest.sentry.io/0

# ── Telegram admin notification bot (optional) ───────────────────────────────
telegram_admin_bot_token: your_admin_bot_token
telegram_admin_chat_id: "123456789"
telegram_admin_webhook_secret: generate_a_long_random_secret

# ── Admin "debug curl" panels only (optional) ────────────────────────────────
ollama_url: http://localhost:11434
