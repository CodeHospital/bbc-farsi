# One Rails image, four services, split by APP_ROLE (see app/services/app_role.rb):
#
#   public  → www.khabarestan.com     news portal, guest edit links
#             (+ khabarestan.com, which Rails 301-redirects to www)
#   admin   → admin.khabarestan.com   admin UI, ActionCable
#   api     → api.khabarestan.com     worker task queue, llmarkt + Telegram webhooks
#   worker  → worker.khabarestan.com  feed fetch / Telegram autopost / image
#                                     pollers + their status page
#
# This file has no reverse proxy: on Coolify (or any platform with its own
# proxy) assign each domain to its service on port 80 in the platform's domain
# settings. For a plain server, add Caddy (automatic TLS) with the override:
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# The database is the external PostgreSQL from the `database_url` credential.
# Credentials need app_base_url, admin_base_url, api_base_url and
# worker_base_url set to the https:// URLs (see config/credentials.example.yml). RAILS_MASTER_KEY
# must be set in the environment (Coolify: the app's environment variables).

x-app: &app
  build: .
  image: khabarestan:latest
  restart: unless-stopped
  expose:
    - "80"
  volumes:
    - khabarestan_storage:/rails/storage
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost/up"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s

x-app-environment: &app-environment
  RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set RAILS_MASTER_KEY}
  RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}

services:
  # Boots first and runs db:prepare + db:seed (bin/docker-entrypoint); the
  # others wait for it to be healthy so they never race the schema/seed.
  admin:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: admin

  public:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: public
      # Keep answering /api/* on khabarestan.com until the worker (APP_URL),
      # llmarkt callbacks and the Telegram webhook (bin/rails
      # telegram_admin:set_webhook) point at api.khabarestan.com — then set 0.
      LEGACY_API_ON_PUBLIC: ${LEGACY_API_ON_PUBLIC:-1}
    depends_on:
      admin:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: api
    depends_on:
      admin:
        condition: service_healthy

  # Runs the pollers inside its web server, which serves their status page.
  worker:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: worker
    depends_on:
      admin:
        condition: service_healthy

volumes:
  khabarestan_storage:
