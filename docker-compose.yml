# One Rails image, four services, split by APP_ROLE (see app/services/app_role.rb)
# and fronted by Caddy, which terminates TLS and routes each domain:
#
#   khabarestan.com        → public  (news portal, guest edit links)
#   admin.khabarestan.com  → admin   (admin UI, ActionCable)
#   api.khabarestan.com    → api     (worker task queue, llmarkt + Telegram webhooks)
#   (no domain)              worker  (feed fetch / Telegram autopost / image pollers)
#
# The database is the external PostgreSQL from the `database_url` credential.
# Credentials need app_base_url, admin_base_url and api_base_url set to the
# three https:// URLs (see config/credentials.example.yml).
#
#   RAILS_MASTER_KEY=... docker compose up -d --build
#
# Domains can be overridden with PUBLIC_DOMAIN / ADMIN_DOMAIN / API_DOMAIN
# (they only affect Caddy; Rails reads its hosts from credentials).

x-app: &app
  build: .
  image: khabarestan:latest
  restart: unless-stopped
  volumes:
    - khabarestan_storage:/rails/storage
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost/up"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s

x-app-environment: &app-environment
  RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set RAILS_MASTER_KEY}
  RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}

services:
  # Boots first and runs db:prepare + db:seed (bin/docker-entrypoint); the
  # others wait for it to be healthy so they never race the schema/seed.
  admin:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: admin

  public:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: public
      # Keep answering /api/* on khabarestan.com until the worker (APP_URL),
      # llmarkt callbacks and the Telegram webhook (bin/rails
      # telegram_admin:set_webhook) point at api.khabarestan.com — then set 0.
      LEGACY_API_ON_PUBLIC: ${LEGACY_API_ON_PUBLIC:-1}
    depends_on:
      admin:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-environment
      APP_ROLE: api
    depends_on:
      admin:
        condition: service_healthy

  worker:
    <<: *app
    command: ["./bin/rails", "pollers:run"]
    environment:
      <<: *app-environment
      APP_ROLE: worker
    # No web server, so no /up to probe.
    healthcheck:
      disable: true
    depends_on:
      admin:
        condition: service_healthy

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-khabarestan.com}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.khabarestan.com}
      API_DOMAIN: ${API_DOMAIN:-api.khabarestan.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - public
      - admin
      - api

volumes:
  khabarestan_storage:
  caddy_data:
  caddy_config:
